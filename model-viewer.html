<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: transparent;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      display: block;
    }
  </style>
</head>

<body>

<model-viewer 
  src="https://nutmegsoup.github.io/assets/use/cnd_stall.glb"
  ios-src="https://nutmegsoup.github.io/assets/use/cnd_ios.usdz"
  ar-modes="webxr scene-viewer quick-look"
  touch-action="pan-y"
  field-of-view="32deg"
  camera-orbit="-15deg 75deg"
  tone-mapping="neutral"
  environment-image="neutral"
  poster="https://nutmegsoup.github.io/assets/use/cnd_poster.webp"
  shadow-intensity="1"
  autoplay
  ar>
</model-viewer>

</body>
</html>
