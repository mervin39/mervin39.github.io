<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      display: block;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      max-width: 100%;
      --max-canvas-size: 4096px;
    }

    #ar-prompt {
      position: absolute;
      right: 5%;
      bottom: 8%;
      width: 40%;
      height: 40%;
      cursor: pointer;
      z-index: 10;
    }

    #ar-prompt img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0px 6px 8px rgba(0, 0, 0, 0.45));
    }
  </style>
</head>

<body>

<model-viewer 
  src="https://nutmegsoup.github.io/assets/use/cnd_stall.glb"
  ios-src="https://nutmegsoup.github.io/assets/use/cnd_ios.usdz"
  ar-modes="webxr scene-viewer quick-look"
  touch-action="pan-y"
  field-of-view="32deg"
  camera-orbit="-15deg 75deg"
  tone-mapping="neutral"
  environment-image="neutral"
  poster="https://nutmegsoup.github.io/assets/use/cnd_poster.webp"
  shadow-intensity="1"
  autoplay
  ar>
  <div slot="ar-button" id="ar-prompt">
    <img src="https://nutmegsoup.github.io/assets/posters/launch_button_lilac.svg">
  </div>
</model-viewer>

</body>
</html>
<script>
  const mv = document.querySelector('model-viewer');

  function roundModelViewerSize() {
    const r = mv.getBoundingClientRect();
    mv.style.width = Math.round(r.width) + 'px';
    mv.style.height = Math.round(r.height) + 'px';
  }

  window.addEventListener('load', roundModelViewerSize);
  window.addEventListener('resize', roundModelViewerSize);
</script>
